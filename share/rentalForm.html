<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>대여 신청 | 케어쉐어</title><link rel="stylesheet" href="../css/careshare.css"><link rel="stylesheet" href="../css/demo.css"><link rel="stylesheet" href="../css/improvements.css"></head><body data-menu="share" data-root="../"><a class="skip-link" href="#main-content">본문 바로가기</a><div class="page"><div id="site-header"></div><section class="page-head"><div class="page-head-inner"><div class="crumb">복지용구 &nbsp;›&nbsp; <b>대여 신청</b></div><h1>대여 신청</h1></div></section><main id="main-content" class="wrap form-layout"><form class="form-col demo-submit"><section class="card"><div class="card-head"><span class="card-num">1</span><h2>대여 기간</h2></div><div class="field"><label>대여 기간<span class="req">*</span></label><div class="choice-grid"><label><input type="radio" checked><span>1개월</span></label><label><input type="checkbox" ><span>3개월</span></label><label><input type="checkbox" ><span>6개월</span></label></div></div><div class="row2"><div class="field"><label>대여 예정일</label><input type="date" placeholder="" value="2026-11-09"></div><div class="field"><label>반납 예정일</label><input type="date" placeholder="" value="2027-02-07"></div></div></section><section class="card"><div class="card-head"><span class="card-num">2</span><h2>수령 방법</h2></div><div class="choice-grid"><label><input type="radio" checked><span>기관 방문</span></label><label><input type="checkbox" ><span>배송 (실비)</span></label></div><div class="notice-line">기관 방문 수령은 예정일로부터 일주일 내 방문해 주세요.</div></section><section class="card"><div class="card-head"><span class="card-num">3</span><h2>신청자 정보</h2></div><div class="row2"><div class="field"><label>이름</label><input type="text" placeholder="" value="김지우"></div><div class="field"><label>연락처</label><input type="tel" placeholder="" value="010-0000-0000"></div></div><div class="field"><label>신청자와의 관계</label><select><option>본인</option><option>부모</option><option>자녀<
