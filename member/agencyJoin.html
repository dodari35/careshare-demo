<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기관 가입 신청 | 케어쉐어</title><link rel="stylesheet" href="../css/careshare.css"><link rel="stylesheet" href="../css/demo.css"><link rel="stylesheet" href="../css/improvements.css"></head><body data-menu="share" data-root="../"><a class="skip-link" href="#main-content">본문 바로가기</a><div class="page"><div id="site-header"></div><section class="page-head"><div class="page-head-inner"><div class="crumb">복지용구 &nbsp;›&nbsp; <b>기관 가입 신청</b></div><h1>기관 가입 신청</h1><p>기관 정보 확인 후 관리자가 승인합니다.</p></div></section><main id="main-content" class="narrow-wrap"><form class="content-stack demo-submit"><section class="card"><div class="card-head"><span class="card-num">1</span><h2>기관 기본 정보</h2></div><div class="field"><label>기관 유형<span class="req">*</span></label><select><option>기관 유형을 선택하세요</option><option>공공기관</option><option>공단 지정 사업소</option><option>일반 렌탈 업체</option></select></div><div class="field"><label>기관명<span class="req">*</span></label><input type="text" placeholder="기관명을 입력하세요" value=""></div><div class="row2"><div class="field"><label>사업자등록번호</label><input type="text" placeholder="000-00-00000" value=""></div><div class="field"><label>대표 전화</label><input type="text" placeholder="051-000-0000" value=""></div></div></section><section class="card"><div class="card-head"><span class="card-num">2</span><h2>주소와 운영 정보</h2></div><div class="field"><label>우편번호</label><div class="inline-input"><input type="text" placeholder="우편번호" value=""><button type="button" class="btn btn-ghost" data-demo-action>주소 검색</button></div></div><div class="field"><label>기본 주소</label><input type="text" placeholder="주소 검색을 이용하세요" value=""></div><div class="field"><label>운영 요일</label><div class="day-grid"><label><input type="checkbox" checked><span>월</span></label><label><input type="checkbox" checked><span>화</span></label><label><input type="checkbox" checked><span>수</span></label><label><input type="checkbox" checked><span>목</span></label><label><input type="checkbox" checked><span>금</span></label><label><input type="checkbox" ><span>토</span></label><label><input type="checkbox" ><span>일</span></label></div></div><div class="row2"><div class="field"><label>여는 시각</label><input type="time" placeholder="" value="09:00"></div><div class="field"><label>닫는 시각</label><input type="time" placeholder="" value="18:00"></div></div></section><section class="card"><div class="card-head"><span class="card-num">3</span><h2>증빙과 소개</h2></div><div class="field"><label>사업자등록증 사본<span class="req">*</span></label><div class="file-box"><input type="file"><p>PDF, JPG, PNG · 최대 5MB</p></div></div><div class="field"><label>소개</label><textarea rows="5" placeholder="기관과 제공 서비스를 소개해 주세요."></textarea></div></section><div class="submit-bar"><a class="btn btn-ghost" href="../index.html" data-demo-action>취소</a><button class="btn btn-primary">등록 신청</button></div></form></main><div id="site-footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"><span class="tick"></span><span>처리되었습니다.</span></div><noscript><p>이 시연본의 메뉴와 검색은 JavaScript를 켜야 사용할 수 있습니다.</p></noscript><script src="../js/improvements.js"></script><script src="../js/demo.js"></script></body></html>
